name: CI

# The CLI only. The agent is an XCUITest target whose suites need a booted
# simulator and a ~1-3 minute `xcodebuild build-for-testing`, so it is a separate
# job to add once this one is known good — not a reason to leave the fast half
# unguarded. `swift test` runs 299 tests in seconds and needs no simulator.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for a job that only builds and runs tests. Without this the
# token's scopes come from the repository/org default, which can include write.
# Set at the top level so a job added later starts read-only and has to ask.
permissions:
  contents: read

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI build and test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      # cli/Package.swift declares swift-tools-version 6.3, which the runner's
      # *default* Xcode may predate. Select the newest one installed rather than
      # pinning a version that silently disappears when the image is updated, and
      # print it so a toolchain mismatch reads as one in the log.
      - name: Select the newest installed Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
