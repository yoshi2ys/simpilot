name: CI

# Two jobs, kept separate because their costs differ by an order of magnitude:
# `swift test` runs the CLI's 299 tests in seconds with no simulator, while the
# agent's suites live in an XCUITest target and need a simulator plus a build of
# a few minutes. Splitting them means a CLI-only break is reported in about a
# minute instead of waiting on the slow half.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for a job that only builds and runs tests. Without this the
# token's scopes come from the repository/org default, which can include write.
# Set at the top level so a job added later starts read-only and has to ask.
permissions:
  contents: read

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI build and test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      # cli/Package.swift declares swift-tools-version 6.3, which the runner's
      # *default* Xcode may predate. Select the newest one installed rather than
      # pinning a version that silently disappears when the image is updated, and
      # print it so a toolchain mismatch reads as one in the log.
      - name: Select the newest installed Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  agent:
    name: Agent build and test
    runs-on: macos-latest
    # `AgentUITests/testAgent` is the HTTP server entry point and never returns,
    # so a mistake in the -only-testing list below does not fail — it hangs until
    # the six-hour default kills it. Bound it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      # By UDID, not `name=iPhone 17 Pro`: which devices an image ships changes
      # with every runner update, and a name that stops existing fails as an
      # unhelpful destination error. Any iPhone will do — these suites are logic
      # tests that happen to live in a UI test target — so take the first
      # available one and log which it was.
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[]
                      | select(.key | test("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))] | first | .udid // empty')
          if [ -z "$udid" ]; then
            echo "No available iPhone simulator on this runner:"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Named suites only. Running the whole AgentUITests target would start
      # `testAgent`, the long-running server, and never finish.
      - name: Test
        working-directory: agent
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcodebuild test \
            -project AgentApp.xcodeproj \
            -scheme AgentUITests \
            -destination "id=$UDID" \
            -only-testing:AgentUITests/StablePredicateTests \
            -only-testing:AgentUITests/PredicateEvaluatorTests \
            -only-testing:AgentUITests/DebugDescriptionParserTests \
            -only-testing:AgentUITests/ActionHandlerTests \
            -only-testing:AgentUITests/BatchHandlerTests \
            -only-testing:AgentUITests/HTTPParserTests \
            -only-testing:AgentUITests/TapHandlerTests \
            -only-testing:AgentUITests/ButtonHandlerTests \
            -only-testing:AgentUITests/AgentConfigTests \
            -only-testing:AgentUITests/OutlineRendererTests \
            -only-testing:AgentUITests/ElementsHandlerFormatTests \
            -only-testing:AgentUITests/AliasResolverTests \
            -quiet
